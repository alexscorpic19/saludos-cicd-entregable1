name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag a desplegar (latest, o el SHA de CI para rollback)"
        default: "latest"
        required: false

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  TAG: ${{ github.event.inputs.image_tag || 'latest' }}
  BACKEND_IP: ${{ vars.BACKEND_PRIVATE_IP }}
  FE2_IP: ${{ vars.FE2_PRIVATE_IP }}
  ALB: ${{ vars.ALB_DNS }}

jobs:
  pull:
    name: Release - Pull
    runs-on: [self-hosted, cicd]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Autenticar en Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Pull de imagenes publicadas por CI
        run: |
          echo "Desplegando tag: $TAG"
          docker pull $DOCKERHUB_USERNAME/saludos-backend:$TAG
          docker pull $DOCKERHUB_USERNAME/saludos-frontend:$TAG
          docker image inspect \
            --format '{{json .RepoDigests}}' \
            $DOCKERHUB_USERNAME/saludos-backend:$TAG \
            $DOCKERHUB_USERNAME/saludos-frontend:$TAG
          echo "CD no reconstruye: solo consume los artefactos de CI."

      - name: Logout de Docker Hub
        if: always()
        run: docker logout

  deploy:
    name: Deploy
    needs: pull
    runs-on: [self-hosted, cicd]
    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/saludos-key.pem
          chmod 600 ~/.ssh/saludos-key.pem
          for h in $BACKEND_IP $FE2_IP; do
            ssh-keyscan -H $h >> ~/.ssh/known_hosts 2>/dev/null
          done

      - name: Elegir ambiente (Gitflow)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="manual"
            APP_ENV=production
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            APP_ENV=development
            [ "$BRANCH" = "main" ] && APP_ENV=production
          fi
          echo "APP_ENV=$APP_ENV" >> $GITHUB_ENV
          echo "Rama: $BRANCH -> APP_ENV=$APP_ENV"

      - name: Deploy backend-1 (SSH)
        run: |
          ssh -i ~/.ssh/saludos-key.pem ubuntu@$BACKEND_IP \
            "docker pull $DOCKERHUB_USERNAME/saludos-backend:$TAG && \
             docker rm -f saludos-backend 2>/dev/null || true; \
             docker run -d --name saludos-backend --restart unless-stopped \
               -p 5000:5000 --env-file /home/ubuntu/saludos-backend.env \
               -e APP_ENV=$APP_ENV \
               $DOCKERHUB_USERNAME/saludos-backend:$TAG"

      - name: Esperar a que el backend este listo
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://$BACKEND_IP:5000/health >/dev/null 2>&1; then
              ok=1; echo "Backend listo (intento $i)"; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "Backend no respondio"
            ssh -i ~/.ssh/saludos-key.pem ubuntu@$BACKEND_IP "docker logs saludos-backend"
            exit 1
          fi

      - name: Deploy frontend-2 (SSH)
        run: |
          ssh -i ~/.ssh/saludos-key.pem ubuntu@$FE2_IP \
            "echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u $DOCKERHUB_USERNAME --password-stdin && \
             docker pull $DOCKERHUB_USERNAME/saludos-frontend:$TAG && \
             docker rm -f saludos-frontend 2>/dev/null || true; \
             docker run -d --name saludos-frontend --restart unless-stopped \
               -p 8080:80 --env-file /home/ubuntu/saludos-frontend.env \
               -e APP_ENV=$APP_ENV \
               $DOCKERHUB_USERNAME/saludos-frontend:$TAG"

      - name: Deploy frontend-1 (runner)
        run: |
          docker rm -f saludos-frontend 2>/dev/null || true
          docker run -d --name saludos-frontend --restart unless-stopped \
            -p 8080:80 --env-file /home/ubuntu/saludos-frontend.env \
            -e APP_ENV=$APP_ENV \
            $DOCKERHUB_USERNAME/saludos-frontend:$TAG

  verify:
    name: Verificacion
    needs: deploy
    runs-on: [self-hosted, cicd]
    steps:
      - name: Verify - aplicacion arriba y accesible
        run: |
          sleep 5
          echo "--- frontend-1 (runner) ---"
          curl -fsS http://localhost:8080/ | grep -qi "three-tier"
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"OK"'
          echo "--- backend-1 ---"
          curl -fsS http://$BACKEND_IP:5000/health | grep -q '"status":"OK"'
          echo "--- frontend-2 ---"
          curl -fsS http://$FE2_IP:8080/ | grep -qi "three-tier"
          echo "--- extremo a extremo por el ALB ---"
          curl -fsS http://$ALB/api/saludo | grep -q '"mensaje"'
          echo "--- contenedores ---"
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo "Verificacion OK"
